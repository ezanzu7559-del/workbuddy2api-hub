services:
  - type: web
    name: workbuddy-deepseek-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        sync: false
      - key: PANEL_PASSWORD
        value: "change-me-to-a-strong-password"
      - key: WB_PROXY_DEFAULT_REALM
        value: "cn"
      - key: TZ
        value: "Asia/Shanghai"
